[project]
name = "ksp-translator"
version = "0.1.0"
description = "KSP 1.12.x mod localization translator (EN -> KO) using Gemini API"
readme = "README.md"
authors = [
    { name = "SeoHyeon", email = "tjgus1668@naver.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "google-genai>=1.0",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
]

[project.scripts]
ksp-translator = "ksp_translator.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pytest>=9.0.2",
]
