name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 릴리스 노트용 커밋 히스토리

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kerbaloc-app/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: Install frontend dependencies
        working-directory: kerbaloc-app
        run: npm ci

      # 버전: 0.1.<run_number> — 업데이터가 버전 비교로 갱신을 판단하므로 매 릴리스 증가 필수
      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Patch app version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'kerbaloc-app/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = '${{ steps.ver.outputs.version }}';
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      # 릴리스 노트: 직전 릴리스 태그 이후의 커밋 목록
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "body<<NOTES_EOF"
            echo "## 변경 사항"
            echo ""
            git log $range --no-merges --pretty=format:"- %s (%h)"
            echo ""
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # 포터블 단일 exe — 인스톨러/번들 없이 실행 파일만 만든다
      - name: Build app (portable exe)
        working-directory: kerbaloc-app
        run: npm run tauri build -- --no-bundle

      - name: Collect portable exe
        shell: bash
        run: |
          if [ -f target/release/KerbaLoc.exe ]; then
            cp target/release/KerbaLoc.exe KerbaLoc.exe
          else
            cp target/release/kerbaloc-app.exe KerbaLoc.exe
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: KerbaLoc v${{ steps.ver.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: KerbaLoc.exe
          make_latest: true
