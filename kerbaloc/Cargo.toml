[workspace]
members = ["kerbaloc-core", "kerbaloc-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
regex = "1"
unicode-normalization = "0.1"
walkdir = "2"
